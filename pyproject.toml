[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "agent-backtrace"
version = "0.10.0"
description = "A local-first flight recorder for AI coding-agent traces"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Vishnu Gamini" }]
keywords = ["agents", "codex", "claude-code", "observability", "jsonl", "debugging"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
backtrace-agent = "backtrace_agent.cli:main"

[project.urls]
Homepage = "https://github.com/vishnugamini/agent-backtrace"
Issues = "https://github.com/vishnugamini/agent-backtrace/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/backtrace_agent"]

[tool.pytest.ini_options]
testpaths = ["tests_python"]
